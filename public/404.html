<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Room not found, Hussain Habib</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap" rel="stylesheet" />
<style>
  :root { --paper: #f5f2e8; --ink: #14231b; --ink-3: #5d6b5e; --sprout: #456917; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #101a15; --ink: #eff3e6; --ink-3: #93a393; --sprout: #b8e45e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.25rem; text-align: center;
    padding: 2rem; background: var(--paper); color: var(--ink);
    font-family: 'Google Sans', system-ui, sans-serif;
  }
  svg.mark { width: 72px; height: 72px; }
  .mark rect { fill: var(--paper); stroke: var(--ink-3); stroke-width: .5; }
  .mark .bracket { stroke: var(--sprout); }
  .mark .ring { stroke: var(--ink-3); opacity: .55; }
  .mark .core { fill: var(--ink); stroke: none; }
  h1 {
    font-family: 'Google Sans', system-ui, sans-serif;
    font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700; margin: 0;
  }
  p { max-width: 34ch; color: var(--ink-3); margin: 0; line-height: 1.5; }
  a {
    color: var(--sprout); font-weight: 600; text-decoration: none;
    border-bottom: 1px solid currentColor; padding-bottom: .1em;
  }
  a:hover { opacity: .8; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="8"/>
    <g fill="none" stroke-linecap="round">
      <path class="bracket" d="M7 13.5V9.5A2.5 2.5 0 0 1 9.5 7h4M18.5 25h4a2.5 2.5 0 0 0 2.5-2.5v-4" stroke-width="2.8"/>
      <circle class="ring" cx="16" cy="16" r="6.5" stroke-width="2"/>
      <circle class="core" cx="16" cy="16" r="3.2"/>
    </g>
  </svg>
  <h1>This room is not on the floor plan.</h1>
  <p>The page you followed does not exist, or moved when the site was last rebuilt.</p>
  <a href="/">Back to the floor plan</a>
</body>
</html>
